<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="광주에서 태어난 박유성의 한평생을 선택지로 키워 가는 인생 시뮬레이션 게임">
<title>유성, 광주에서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 왼쪽 인생 계기판(나이·스탯) + 오른쪽 이야기 카드와 연표. 폰에서는 위아래로 쌓임. 빛고을의 '빛'을 앰버 하이라이트로, 무등산 숲을 초록 액센트로. */
:root{
  --bg:#EDF0EE; --surface:#F8FAF9; --line:#D3D9D6; --fg:#1B232B; --muted:#5E6A70;
  --accent:#2E6A4F; --accent-soft:#DCE9E2; --light:#C68716; --light-soft:#F6E9CF;
  --bad:#B4443A; --good:#2E6A4F;
  --f-story:"Gowun Batang", "Noto Serif KR", serif;
  --f-ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --surface:#182027; --line:#2A343D; --fg:#E4E8EA; --muted:#93A0A6;
  --accent:#72B693; --accent-soft:#1F3229; --light:#E6AC45; --light-soft:#3A2E17;
  --bad:#E07A6F; --good:#72B693; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#182027; --line:#2A343D; --fg:#E4E8EA; --muted:#93A0A6;
  --accent:#72B693; --accent-soft:#1F3229; --light:#E6AC45; --light-soft:#3A2E17;
  --bad:#E07A6F; --good:#72B693; color-scheme:dark}
body{margin:0}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.app{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:800px){.app{grid-template-columns:minmax(0,1fr)}}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--light);outline-offset:2px}

/* 계기판 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px;position:sticky;top:16px}
@media (max-width:800px){.panel{position:static}}
.who{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.who h1{font-family:var(--f-story);font-weight:700;font-size:28px;margin:0;line-height:1.1;letter-spacing:-.01em}
.who .sub{color:var(--muted);font-size:13px;margin-top:4px}
.age{text-align:right}
.age b{font-family:var(--f-num);font-size:40px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.age span{font-size:12px;color:var(--muted)}
.stages{display:flex;gap:2px;position:relative;margin-top:2px}
.stages div{height:6px;border-radius:2px;background:var(--line)}
.stages div.on{background:var(--accent)}
.stages div.now{background:var(--light)}
.stage-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.stage-label strong{color:var(--fg);font-weight:600}
.stats{display:grid;gap:11px}
.stat{display:grid;grid-template-columns:52px 1fr 44px;align-items:center;gap:10px;font-size:13px}
.stat .bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.stat .bar i{display:block;height:100%;background:var(--accent);transition:width .5s ease}
.stat .bar i.low{background:var(--bad)}
.stat .v{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.money{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:12px}
.money span{font-size:13px;color:var(--muted)}
.money b{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
.money b.neg{color:var(--bad)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:500;min-width:0}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
.ctrl button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px}
.ctrl button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* 이야기 */
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 28px 24px;position:relative;overflow:hidden}
@media (max-width:500px){.card{padding:22px 18px 20px}}
.card::before{content:"";position:absolute;top:-80px;right:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,var(--light-soft) 0%,transparent 70%);pointer-events:none}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--light);font-weight:600;position:relative}
.card h2{font-family:var(--f-story);font-size:26px;font-weight:700;margin:6px 0 12px;text-wrap:balance;line-height:1.3;position:relative}
.story{font-family:var(--f-story);font-size:17px;line-height:1.8;max-width:62ch;margin:0;position:relative}
.choices{display:grid;gap:10px;margin-top:22px;position:relative}
.choice{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:baseline;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice .k{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.choice.locked{opacity:.45;cursor:not-allowed}
.choice.locked:hover{border-color:var(--line);background:var(--bg)}
.choice small{display:block;color:var(--muted);font-size:12px}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;position:relative}
.deltas span{font-family:var(--f-num);font-size:12px;padding:3px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line)}
.deltas .up{color:var(--good)} .deltas .dn{color:var(--bad)}
.primary{margin-top:20px;background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:12px 22px;font-weight:600;position:relative}
.primary:hover{opacity:.9}
.ticker{font-family:var(--f-story);font-size:17px;color:var(--muted);min-height:3.4em;position:relative}
.ticker b{color:var(--fg);font-family:var(--f-num);font-weight:500;font-size:14px;margin-right:8px}

/* 연표 */
.log h3{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 10px}
.log ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);max-height:420px;overflow:auto}
.log li{padding:6px 0 6px 16px;position:relative;font-size:14px}
.log li::before{content:"";position:absolute;left:-5px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.log li.key::before{background:var(--light)}
.log li.key{font-weight:500}
.log li em{font-style:normal;font-family:var(--f-num);color:var(--muted);font-size:12px;margin-right:8px;font-variant-numeric:tabular-nums}

.end-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:18px;position:relative}
.end-grid div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.end-grid span{display:block;font-size:12px;color:var(--muted)}
.end-grid b{font-family:var(--f-num);font-size:18px}
.epitaph{font-family:var(--f-story);font-size:20px;border-left:3px solid var(--light);padding-left:14px;margin:18px 0 0;position:relative}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="panel" aria-label="박유성의 현재 상태">
    <div class="who">
      <div><h1>박유성</h1><div class="sub" id="sub">광주광역시 · 2026년생</div></div>
      <div class="age"><b id="age">0</b><span>세 · <span id="year">2026</span>년</span></div>
    </div>
    <div>
      <div class="stages" id="stages"></div>
      <div class="stage-label"><strong id="stageName">유아기</strong><span id="stageRange">0–6세</span></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="money"><span>자산</span><b id="money">부모님 품</b></div>
    <dl class="facts" id="facts"></dl>
    <div class="ctrl" role="group" aria-label="시간 속도">
      <button id="pauseBtn" aria-pressed="false">일시정지</button>
      <button data-speed="1" aria-pressed="true">1배</button>
      <button data-speed="2" aria-pressed="false">2배</button>
      <button data-speed="4" aria-pressed="false">4배</button>
    </div>
  </aside>
  <main class="main">
    <section class="card" id="card" aria-live="polite"></section>
    <section class="log"><h3>인생 연표</h3><ol id="log"></ol></section>
  </main>
</div>

<script>
const BIRTH=2026;
const STAGES=[["유아기",0,6],["아동기",7,12],["청소년기",13,18],["청년기",19,34],["장년기",35,49],["중년기",50,64],["노년기",65,100]];
const STATDEF=[["h","건강"],["p","행복"],["r","평판"],["s","역량"]];
const INCOME={none:0,student:-150,part:350,kia:1900,samsung:2200,gov:1200,research:1700,art:450,council:1500,retired:300,
  startup:()=>rnd(-900,3600),cafe:()=>rnd(-700,1700),shop:()=>rnd(-300,900),stall:()=>rnd(-200,700)};
const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));
const chance=p=>Math.random()<p;
const clamp=v=>Math.max(0,Math.min(100,v));

let S, timer=null, speed=1, paused=false, mode="intro", current=null, lastResult=null;

function fresh(){
  return {age:0,m:0,h:72,p:60,r:40,s:30,job:"none",work:"—",edu:"—",marry:"미혼",partner:null,kids:0,home:"남구 양림동",flags:{},log:[],dead:false};
}

/* ---------- 이벤트 ---------- */
// e: 효과 {m,h,p,r,s}, f: 상태 변경, r: 결과 문장. 선택지 자체가 함수면 실행 결과를 반환.
const EVENTS=[
{age:1,title:"돌잡이",text:"양림동 할머니 댁 마당에 상이 차려졌다. 친척들이 숨을 죽이고 유성이의 손끝을 본다.",ch:[
 {t:"연필을 잡는다",e:{s:6},f:s=>s.flags.pencil=1,r:"연필을 꽉 쥐었다. 할머니가 \"판사 되겄네\" 하신다."},
 {t:"오만원권을 잡는다",e:{p:3},f:s=>s.flags.luck=1,r:"돈을 잡았다. 아버지가 제일 크게 웃었다."},
 {t:"기아 타이거즈 야구공을 잡는다",e:{h:6,p:4},f:s=>s.flags.tigers=1,r:"야구공을 입에 넣으려다 삼촌이 \"평생 기아 팬 확정\"이라고 외쳤다."}]},
{age:3,title:"이사",text:"아버지가 직장을 옮기면서 가족이 이사를 고민한다. 어머니는 아이 키우기 좋은 동네가 먼저라고 한다.",ch:[
 {t:"양림동 오래된 주택에 남는다",e:{p:5,r:3},f:s=>s.home="남구 양림동",r:"선교사 사택 골목과 담쟁이 사이에서 자라게 됐다."},
 {t:"광산구 수완지구 신축 아파트",e:{s:3,p:2},f:s=>s.home="광산구 수완지구",r:"놀이터가 세 개 있는 단지. 학원 버스가 아파트 앞까지 온다."},
 {t:"북구 첨단지구",e:{h:4},f:s=>s.home="북구 첨단지구",r:"쌍암공원 호수 옆으로 이사했다. 산책이 일상이 됐다."}]},
{age:5,title:"첫 무등산",text:"아버지가 \"무등산 정상 보러 갈래?\" 하고 묻는다. 원효사 주차장에서 올려다본 산이 끝도 없다.",ch:[
 {t:"서석대까지 끝까지 오른다",e:{h:8,p:3},f:s=>s.flags.hiker=1,r:"울면서 올랐는데, 주상절리를 보고 울음을 그쳤다."},
 {t:"증심사 계곡에서 물놀이만",e:{p:6,h:3},r:"발 담그고 수박 먹은 기억만 오래 남았다."},
 {t:"집에서 태블릿 본다",e:{h:-4,p:2},r:"아버지 혼자 다녀왔다. 사진 속 하늘이 예뻤다."}]},
{age:7,title:"초등학교 입학",text:s=>`${s.home.split(" ")[1]}의 초등학교에 입학했다. 어머니가 방과 후를 어떻게 보낼지 묻는다.`,ch:[
 {t:"영어·수학 학원",e:{s:8,p:-4},f:s=>{s.job="student";s.work="초등학생"},r:"받아쓰기 100점이 늘었다. 놀이터 친구는 줄었다."},
 {t:"태권도장",e:{h:6,r:2},f:s=>{s.job="student";s.work="초등학생"},r:"노란띠를 매고 동네를 뛰어다녔다."},
 {t:"골목에서 실컷 논다",e:{p:7,s:-2},f:s=>{s.job="student";s.work="초등학생"},r:"해 질 녘까지 술래잡기. 저녁마다 무릎이 까져 있었다."}]},
{age:9,title:"챔피언스필드",text:s=>`삼촌이 광주-기아 챔피언스필드 표를 구해왔다.${s.flags.tigers?" 돌잡이 때 잡은 야구공 이야기가 또 나온다.":""}`,ch:[
 {t:"응원단 앞에서 목청껏 응원",e:{p:8,r:2},r:"목이 쉬었다. 기아가 9회말에 이겼다."},
 {t:"리틀야구단에 들어간다",e:{h:8,s:-2},f:s=>s.flags.baseball=1,r:"주말마다 그라운드에서 흙투성이가 됐다."},
 {t:"숙제 때문에 안 간다",e:{s:4,p:-5},r:"그날 기아는 끝내기 홈런을 쳤다고 한다."}]},
{age:11,title:"반장 선거",text:"5학년 2학기 반장 선거. 짝꿍이 \"너 나가면 찍어줄게\"라고 속삭인다.",ch:[
 {t:"출마해서 연설한다",x:s=>chance(.45+s.r/200)?{e:{r:9,p:6},r:"한 표 차이로 반장이 됐다. 연설에서 무등산 이야기를 한 게 먹혔다."}:{e:{r:3,p:-4},r:"두 표 차이로 떨어졌다. 그래도 연설은 잘했다는 말을 들었다."}},
 {t:"친구를 밀어준다",e:{r:4,p:3},r:"친구가 반장이 됐고, 유성이는 부반장이 됐다."},
 {t:"관심 없다",e:{p:1},r:"선거 날 급식에 나온 치킨이 더 중요했다."}]},
{age:13,title:"학원 땡땡이",text:"중학교 1학년. 친구 준호가 학원 빠지고 상무지구 PC방에 가자고 한다.",ch:[
 {t:"따라간다",e:{p:6,s:-5,r:-2},f:s=>s.flags.junho=1,r:"학원에서 집으로 전화가 왔다. 그래도 준호와는 평생 친구가 됐다."},
 {t:"거절하고 학원에 간다",e:{s:6,p:-3},r:"준호는 다음 날 혼자 혼났다."},
 {t:"대신 광주천 자전거를 타자고 한다",e:{h:5,p:3},f:s=>s.flags.junho=1,r:"둘이서 광주천을 따라 영산강 합류점까지 달렸다."}]},
{age:15,title:"오월",text:"5월, 역사 수행평가로 5·18민주광장과 옛 전남도청을 찾았다. 분수대 앞에 사람들이 모여 있다.",ch:[
 {t:"해설사 이야기를 끝까지 듣고 기록한다",e:{s:5,r:6},f:s=>s.flags.history=1,r:"보고서가 교내 대회에서 상을 받았다."},
 {t:"할아버지께 그때 이야기를 여쭙는다",e:{p:4,r:4},f:s=>s.flags.history=1,r:"할아버지는 한참 말이 없다가 금남로 이야기를 꺼내셨다."},
 {t:"사진만 찍고 돌아간다",e:{p:2,r:-3},r:"과제는 냈지만 기억에 남는 건 별로 없다."}]},
{age:16,title:"고등학교 진학",text:"담임 선생님이 진학 상담을 하자고 한다.",ch:[
 {t:"인문계 고등학교",e:{s:5},f:s=>{s.edu="일반고";s.work="고등학생"},r:"야간 자율학습의 세계가 열렸다."},
 {t:"자동차 특성화고",e:{s:3,p:2},f:s=>{s.edu="특성화고";s.work="고등학생";s.flags.tech=1},r:"기아 오토랜드 광주 견학이 1학년 첫 행사였다."},
 {t:"예술고 미술과",e:{p:6},f:s=>{s.edu="예술고";s.work="고등학생";s.flags.art=1},r:"양림동 펭귄마을 골목을 스케치북에 담기 시작했다."}]},
{age:17,title:"충장로의 오후",text:"충장로 버스킹 공연에서 옆 학교 학생과 눈이 마주쳤다. 노래가 끝나간다.",ch:[
 {t:"용기 내서 번호를 묻는다",x:()=>chance(.6)?{e:{p:10},r:"번호를 받았다. 그날 밤 문자를 열 번쯤 썼다 지웠다."}:{e:{p:-4,r:1},r:"웃으면서 거절당했다. 그래도 용기 낸 자신이 좀 좋았다."}},

const $=id=>document.getElementById(id);
const val=(v,s)=>typeof v==="function"?v(s):v;
function stageOf(a){return STAGES.find(x=>a>=x[1]&&a<=x[2])||STAGES[6]}
function won(m){
  const neg=m<0, a=Math.abs(m), eok=Math.floor(a/10000), man=a%10000;
  let t=eok?`${eok}억${man?" "+man.toLocaleString()+"만":""}`:`${man.toLocaleString()}만`;
  return (neg?"−":"")+t+"원";
}
function apply(e){
  if(!e)return;
  for(const k of ["h","p","r","s"]) if(e[k]) S[k]=clamp(S[k]+e[k]);
  if(e.m) S.m+=e.m;
}
function addLog(t,key){S.log.unshift({a:S.age,t,key});renderLog()}

function render(){
  $("age").textContent=S.age; $("year").textContent=BIRTH+S.age;
  const st=stageOf(S.age);
  $("stageName").textContent=st[0]; $("stageRange").textContent=st[2]>=100?"65세 이상":`${st[1]}–${st[2]}세`;
  $("stages").innerHTML=STAGES.map(x=>{const w=Math.min(x[2],90)-x[1]+1;const cls=S.age>x[2]?"on":(S.age>=x[1]?"now":"");return `<div class="${cls}" style="flex:${w}" title="${x[0]}"></div>`}).join("");
  $("stats").innerHTML=STATDEF.map(([k,n])=>`<div class="stat"><span>${n}</span><div class="bar"><i class="${S[k]<25?"low":""}" style="width:${S[k]}%"></i></div><span class="v">${Math.round(S[k])}</span></div>`).join("");
  const mEl=$("money");
  if(S.age<19&&S.m===0){mEl.textContent="부모님 품";mEl.className=""}
  else{mEl.textContent=won(S.m);mEl.className=S.m<0?"neg":""}
  $("sub").textContent=`광주광역시 ${S.home} · ${BIRTH}년생`;
  const jobName={none:"없음",student:"학생",part:"아르바이트",kia:"생산직",samsung:"회사원",gov:"공공기관",research:"연구원",art:"예술가",council:"정치인",retired:"은퇴",startup:"스타트업",cafe:"자영업",shop:"자영업",stall:"상인"}[S.job]||"—";
  $("facts").innerHTML=[["직업",S.age<7?"—":jobName],["직장",S.work],["학력",S.edu],["결혼",S.marry+(S.partner&&S.marry!=="이혼"?` · ${S.partner}`:"")],["자녀",S.kids?`${S.kids}명`:"없음"]].map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("");
}
function renderLog(){
  $("log").innerHTML=S.log.slice(0,120).map(l=>`<li class="${l.key?"key":""}"><em>${String(l.a).padStart(2," ")}세</em>${l.t}</li>`).join("");
}

function setCard(html){$("card").innerHTML=html}

function intro(){
  mode="intro";
  setCard(`<div class="eyebrow">2026년 · 광주광역시 남구 양림동</div>
  <h2>박유성이 태어났다</h2>
  <p class="story">3.2kg, 울음소리가 컸다. 아버지 박태수와 어머니 김정희의 첫아이. 창밖으로 무등산 능선이 보인다.<br>이 아이의 한평생을 광주에서 함께 지켜본다. 시간이 흐르다 갈림길이 오면 멈추고, 당신이 고른다.</p>
  <button class="primary" id="startBtn">인생 시작하기</button>`);
  $("startBtn").onclick=start;
}
function start(){
  S=fresh(); renderLog(); addLog("광주 양림동에서 태어났다.",true); render();
  mode="run"; tickerCard("응애. 세상에 나왔다."); schedule();
}
function tickerCard(line){
  setCard(`<div class="eyebrow">${stageOf(S.age)[0]} · ${BIRTH+S.age}년</div><p class="ticker"><b>${S.age}세</b>${line}</p>`);
}
function schedule(){
  clearTimeout(timer);
  if(paused||mode!=="run")return;
  timer=setTimeout(year,1100/speed);
}
function year(){
  S.age++;
  // 수입과 흐름
  if(S.age>=19){
    let inc=val(INCOME[S.job]??0); S.m+=inc;
    if(S.kids&&S.age<S.flags.kidAge+24) S.m-=350*S.kids;
    if(S.flags.house) S.m+=280;
    if(S.age>=75) S.m-=250;
  }
  if(S.age>=7&&S.age<=18) S.s=clamp(S.s+1);
  let dh=0; if(S.age>=40)dh-=1; if(S.age>=60)dh-=1.5; if(S.age>=75)dh-=1;
  if(S.flags.exercise)dh+=1; if(S.flags.neglect)dh-=1; if(S.p>75)dh+=.5;
  S.h=clamp(S.h+dh);
  S.p=clamp(S.p+(S.p>55?-1:S.p<45?1:0));
  if(S.age>=72&&S.marry==="기혼"&&chance(.04)){S.marry="사별";S.p=clamp(S.p-15);addLog(`${S.partner}가 먼저 세상을 떠났다.`,true)}
  if(checkDeath())return;
  // 이벤트
  const ev=EVENTS.find(e=>e.age===S.age&&(!e.req||e.req(S)));
  render();
  if(ev){openEvent(ev);return}
  const pool=AMBIENT.filter(a=>S.age>=a[0]&&S.age<=a[1]);
  let line="조용히 한 해가 지나갔다.";
  if(pool.length&&chance(.65)){const a=pool[Math.floor(Math.random()*pool.length)];apply(a[3]);line=a[2];addLog(line)}
  render(); tickerCard(line); schedule();
}
function checkDeath(){
  let die=S.h<=0||S.age>=100;
  if(!die&&S.age>=62){const p=Math.max(0,S.age-68)*.012+Math.max(0,40-S.h)*.005;die=chance(p)}
  if(die){end();return true}
  return false;
}
function openEvent(ev){
  mode="event"; current=ev;
  const list=val(ev.ch,S);
  setCard(`<div class="eyebrow">${S.age}세 · ${BIRTH+S.age}년 · ${stageOf(S.age)[0]}</div>
  <h2>${ev.title}</h2><p class="story">${val(ev.text,S)}</p>
  <div class="choices">${list.map((c,i)=>{const ok=!c.req||c.req(S);return `<button class="choice${ok?"":" locked"}" data-i="${i}" ${ok?"":"aria-disabled=\"true\""}><span class="k">${i+1}</span><span>${val(c.t,S)}${ok?"":`<small>조건: ${c.lock||"충족 안 됨"}</small>`}</span></button>`}).join("")}</div>`);
  current.list=list;
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{if(!b.classList.contains("locked"))choose(+b.dataset.i)});
}
function choose(i){
  const c=current.list[i];
  const before={m:S.m,h:S.h,p:S.p,r:S.r,s:S.s};
  let out=c.x?c.x(S):{e:c.e,f:c.f,r:c.r};
  apply(out.e); if(out.f)out.f(S);
  const res=val(out.r,S)||"";
  addLog(`${current.title} — ${val(c.t,S)}. ${res}`,true);
  render();
  const names={m:"자산",h:"건강",p:"행복",r:"평판",s:"역량"};
  const ds=Object.keys(before).map(k=>{const d=Math.round((S[k]-before[k]));if(!d)return"";const up=d>0;return `<span class="${up?"up":"dn"}">${names[k]} ${up?"+":"−"}${k==="m"?won(Math.abs(d)):Math.abs(d)}</span>`}).join("");
  mode="result";
  setCard(`<div class="eyebrow">${S.age}세 · ${current.title}</div>
  <h2>${val(c.t,S)}</h2><p class="story">${res}</p>
  ${ds?`<div class="deltas">${ds}</div>`:""}
  <button class="primary" id="contBtn">시간 흘려보내기</button>`);
  $("contBtn").onclick=()=>{if(checkDeath())return;mode="run";tickerCard("시간이 흐른다.");schedule()};
  $("contBtn").focus();
}
function end(){
  mode="end"; clearTimeout(timer); S.dead=true;
  const cause=S.h<=5?"오랜 투병 끝에":S.age>=90?"가족들 곁에서 잠든 채로 평온하게":"어느 봄날 아침, 조용히";
  addLog(`${cause} 눈을 감았다.`,true); render();
  const top=[["r","광주가 오래 기억할 사람"],["p","웃음이 많았던 사람"],["h","무등산처럼 단단했던 사람"],["s","끝까지 배우던 사람"]].sort((a,b)=>S[b[0]]-S[a[0]])[0];
  const epi=S.m>=30000?"알뜰하게 일군 것을 나누고 간 사람":top[1];
  const score=Math.round(S.p*.35+S.h*.15+S.r*.25+S.s*.1+Math.min(15,Math.max(0,S.m/2000)));
  const grade=score>=70?"빛나는 삶":score>=55?"단단한 삶":score>=40?"평범하고 고운 삶":"고단했던 삶";
  setCard(`<div class="eyebrow">${BIRTH}–${BIRTH+S.age} · 향년 ${S.age}세</div>
  <h2>박유성, ${cause} 눈을 감다</h2>
  <p class="story">광주에서 태어나 광주에서 ${S.age}년을 살았다. ${S.marry==="미혼"?"평생 혼자였지만 외롭지만은 않았다.":S.marry==="이혼"?"한 번의 이별이 있었다.":`${S.partner||"배우자"}와 함께한 세월이 길었다.`} ${S.kids?`자녀 ${S.kids}명이 장례식장을 지켰다.`:""} 마지막 직장은 ${S.work}.</p>
  <p class="epitaph">“${epi}”</p>
  <div class="end-grid">
   <div><span>평가</span><b style="font-family:var(--f-story)">${grade}</b></div>
   <div><span>최종 자산</span><b>${won(S.m)}</b></div>
   <div><span>행복</span><b>${Math.round(S.p)}</b></div>
   <div><span>평판</span><b>${Math.round(S.r)}</b></div>
   <div><span>건강</span><b>${Math.round(S.h)}</b></div>
  </div>
  <button class="primary" id="againBtn">다시 태어나기</button>`);
  $("againBtn").onclick=start;
  try{const k="yuseong-lives";const arr=JSON.parse(localStorage.getItem(k)||"[]");arr.unshift({age:S.age,grade,m:S.m,t:Date.now()});localStorage.setItem(k,JSON.stringify(arr.slice(0,20)))}catch(e){}
}

/* 컨트롤 */
$("pauseBtn").onclick=()=>{paused=!paused;$("pauseBtn").setAttribute("aria-pressed",paused);$("pauseBtn").textContent=paused?"계속":"일시정지";schedule()};
document.querySelectorAll("[data-speed]").forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll("[data-speed]").forEach(x=>x.setAttribute("aria-pressed",x===b));schedule()});
document.addEventListener("keydown",e=>{
  if(mode==="event"&&/^[1-6]$/.test(e.key)){const b=document.querySelector(`.choice[data-i="${+e.key-1}"]`);if(b&&!b.classList.contains("locked"))b.click()}
  else if(mode==="result"&&(e.key==="Enter"||e.key===" ")&&document.activeElement.id!=="contBtn"){e.preventDefault();$("contBtn").click()}
});

S=fresh(); render(); addLog("광주 양림동에서 태어날 예정이다."); intro();
</script>

</body>
</html>
